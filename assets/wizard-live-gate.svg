<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 565 373" width="565" height="373" role="img" aria-label="Terminal recording: python3 setup_wizard.py --live">
<rect width="565" height="373" rx="10" fill="#0d1117"/>
<circle cx="20" cy="18" r="5.5" fill="#f85149"/>
<circle cx="39" cy="18" r="5.5" fill="#d29922"/>
<circle cx="58" cy="18" r="5.5" fill="#3fb950"/>
<text x="283" y="22" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#8b949e">python3 setup_wizard.py --live</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">
<text x="18" y="48" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="67" fill="#d29922" font-weight="600" xml:space="preserve">  ══ REAL MONEY SETUP ══</text>
<text x="18" y="86" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="105" fill="#c9d1d9" xml:space="preserve">  This configures orders that spend your actual money.</text>
<text x="18" y="124" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="143" fill="#c9d1d9" xml:space="preserve">  Your paper history on this machine:</text>
<text x="18" y="162" fill="#c9d1d9" xml:space="preserve">    signal files:   0</text>
<text x="18" y="181" fill="#c9d1d9" xml:space="preserve">    decision logs:  6</text>
<text x="18" y="200" fill="#c9d1d9" xml:space="preserve">    journal days:   0</text>
<text x="18" y="219" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="238" fill="#f85149" font-weight="600" xml:space="preserve">  ✗ only 6 paper sessions recorded.</text>
<text x="18" y="257" fill="#c9d1d9" xml:space="preserve">  A quarter of paper sessions (~60) is the honest bar; 20 is the floor</text>
<text x="18" y="276" fill="#c9d1d9" xml:space="preserve">  this wizard will accept. That is not arbitrary — it is roughly the</text>
<text x="18" y="295" fill="#c9d1d9" xml:space="preserve">  point at which you have seen a losing week, a stop fire, and a</text>
<text x="18" y="314" fill="#c9d1d9" xml:space="preserve">  corporate action go through the system.</text>
<text x="18" y="333" fill="#c9d1d9" xml:space="preserve"></text>
<text x="18" y="352" fill="#c9d1d9" xml:space="preserve">  Come back when you have more. Nothing was changed.</text>
</g>
</svg>
